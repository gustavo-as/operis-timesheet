server:
  port: 8081

spring:
  application:
    name: operis-timesheet

  datasource:
    url: jdbc:postgresql://localhost:5433/timesheet
    username: timesheet
    password: timesheet
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

security:
  jwt:
    public-key: classpath:certs/public.pem